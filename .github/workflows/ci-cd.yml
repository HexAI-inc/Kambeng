name: CI CD

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: kambeng-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key
      HEXAI_WEBHOOK_SECRET: test-webhook-secret
      DATABASE_URL: sqlite+aiosqlite:///./kambeng_test.db
      MEDIA_ROOT: media_test
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: pytest

  deploy:
    name: Deploy backend to VPS
    runs-on: ubuntu-latest
    environment: Deployment VPS
    needs:
      - backend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    steps:
      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            cd /opt/Kambeng
            git fetch origin development
            git reset --hard origin/development
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "ERROR: no docker compose found" >&2; exit 1
            fi
            echo "Using compose: $COMPOSE_CMD"
            $COMPOSE_CMD -f backend/docker-compose.yml up -d --build
            echo "Waiting for api container to be ready..."
            sleep 10
            $COMPOSE_CMD -f backend/docker-compose.yml exec -T api alembic upgrade head
            curl -fsS https://api.kambeng.hexai.gm/api/utils/frontend/v1/home-feed >/dev/null
            echo "Deploy complete"