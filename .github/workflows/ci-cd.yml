name: CI CD

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: kambeng-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key
      HEXAI_WEBHOOK_SECRET: test-webhook-secret
      DATABASE_URL: sqlite+aiosqlite:///./kambeng_test.db
      MEDIA_ROOT: media_test
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: pytest

  frontend-checks:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    env:
      CI: "true"
      NEXT_PUBLIC_API_BASE_URL: /api/backend
      BACKEND_API_BASE_URL: http://127.0.0.1:8001/api
      NEXTAUTH_URL: https://kambeng.hexai.gm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy backend to VPS
    runs-on: ubuntu-latest
    environment: Deployment VPS
    needs:
      - backend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    steps:
      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/Kambeng
            git fetch origin development
            git reset --hard origin/development
            COMPOSE_CMD="docker-compose"
            docker compose version >/dev/null 2>&1 && COMPOSE_CMD="docker compose"
            $COMPOSE_CMD -f backend/docker-compose.yml up -d --build
            $COMPOSE_CMD -f backend/docker-compose.yml exec -T api alembic upgrade head
            curl -fsS https://api.kambeng.hexai.gm/api/utils/frontend/v1/home-feed >/dev/null