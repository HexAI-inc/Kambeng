version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kambeng-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kambeng
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kambeng-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/kambeng
      PYTHONUNBUFFERED: "1"
    depends_on:
      - db
    ports:
      - "8001:8001"
    volumes:
      - ./uploads:/app/uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kambeng-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/kambeng
      PYTHONUNBUFFERED: "1"
    depends_on:
      - db
    command: ["python", "-m", "app.workers.recurring_donations_worker"]
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
