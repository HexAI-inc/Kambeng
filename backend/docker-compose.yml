name: kambeng
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kambeng-api
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    environment:
      PYTHONUNBUFFERED: "1"
    # Host networking ignores `ports`, so bind to loopback explicitly: only nginx
    # may reach the API, and the client IP it forwards is trusted for rate limits.
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8001", "--proxy-headers", "--forwarded-allow-ips", "127.0.0.1"]
    volumes:
      - ./uploads:/app/uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kambeng-worker
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    environment:
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "app.workers.scheduler_worker"]
    volumes:
      - ./uploads:/app/uploads
