# Auth endpoints: 10 requests/minute per client IP, short bursts allowed.
# (This file is included in nginx's http context, where limit_req_zone must live.)
limit_req_zone $binary_remote_addr zone=kambeng_auth:10m rate=10r/m;

# ── kambeng.hexai.gm (frontend) ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name kambeng.hexai.gm;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kambeng.hexai.gm;

    ssl_certificate     /etc/letsencrypt/live/kambeng.hexai.gm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kambeng.hexai.gm/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location /uploads/ {
        proxy_pass http://127.0.0.1:8001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── api.kambeng.hexai.gm (backend) ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.kambeng.hexai.gm;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.kambeng.hexai.gm;

    ssl_certificate     /etc/letsencrypt/live/api.kambeng.hexai.gm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kambeng.hexai.gm/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/auth/ {
        limit_req zone=kambeng_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
